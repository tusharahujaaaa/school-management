<div [formGroup]="group" class="grid p-fluid">
    <div class="col-12 md:col-4">
        <app-erp-form-field label="Admission Number" [required]="true" [control]="group.get('admissionNumber')">
            <app-erp-input formControlName="admissionNumber" placeholder="ADM-YYYY-XXX"></app-erp-input>
        </app-erp-form-field>
    </div>
    <div class="col-12 md:col-4">
        <app-erp-form-field label="Roll Number" [required]="true" [control]="group.get('rollNumber')">
            <app-erp-input formControlName="rollNumber" placeholder="Enter roll number"></app-erp-input>
        </app-erp-form-field>
    </div>
    <div class="col-12 md:col-4">
        <app-erp-form-field label="Academic Session" [required]="true" [control]="group.get('academicSession')">
            <app-erp-select formControlName="academicSession" [options]="sessionOptions" placeholder="Select session"></app-erp-select>
        </app-erp-form-field>
    </div>

    <div class="col-12 md:col-4">
        <app-erp-form-field label="Class" [required]="true" [control]="group.get('class')">
            <app-erp-select formControlName="class" [options]="classes" placeholder="Select class"></app-erp-select>
        </app-erp-form-field>
    </div>
    <div class="col-12 md:col-4">
        <app-erp-form-field label="Section" [required]="true" [control]="group.get('section')">
            <app-erp-select formControlName="section" [options]="sections" placeholder="Select section"></app-erp-select>
        </app-erp-form-field>
    </div>
    <div class="col-12 md:col-4">
        <app-erp-form-field label="Admission Date" [required]="true" [control]="group.get('admissionDate')">
            <app-erp-datepicker formControlName="admissionDate" placeholder="Select admission date"></app-erp-datepicker>
        </app-erp-form-field>
    </div>
    
    <div class="col-12 md:col-4">
        <app-erp-form-field label="Status" [required]="true" [control]="group.get('status')">
            <app-erp-select formControlName="status" [options]="statusOptions" placeholder="Select status"></app-erp-select>
        </app-erp-form-field>
    </div>

    <!-- School Transport Section -->
    <div class="col-12 mt-4 pt-2 border-top-1 surface-border">
        <h5 class="text-900 font-semibold text-base m-0 mb-3 flex align-items-center gap-2">
            <i class="pi pi-truck text-primary"></i>
            School Transport Services
        </h5>
        
        <div class="flex align-items-center gap-2 mb-3">
            <p-checkbox formControlName="usesTransport" [binary]="true" inputId="usesTransport"></p-checkbox>
            <label for="usesTransport" class="text-700 font-medium text-sm cursor-pointer select-none">Enable school bus transport services for this student</label>
        </div>

        <div *ngIf="group.get('usesTransport')?.value" class="grid mt-2">
            <div class="col-12 md:col-4">
                <app-erp-form-field label="Bus Route / Vehicle" [required]="true" [control]="group.get('busId')">
                    <app-erp-select formControlName="busId" [options]="busOptions()" placeholder="Select route & plate"></app-erp-select>
                </app-erp-form-field>
            </div>
            <div class="col-12 md:col-4">
                <app-erp-form-field label="Pickup Point" [control]="group.get('pickupPoint')">
                    <app-erp-input formControlName="pickupPoint" placeholder="e.g. Sector 12 Crossing"></app-erp-input>
                </app-erp-form-field>
            </div>
            <div class="col-12 md:col-4">
                <app-erp-form-field label="Drop Point" [control]="group.get('dropPoint')">
                    <app-erp-input formControlName="dropPoint" placeholder="e.g. Main Gate"></app-erp-input>
                </app-erp-form-field>
            </div>
        </div>
    </div>
</div>
