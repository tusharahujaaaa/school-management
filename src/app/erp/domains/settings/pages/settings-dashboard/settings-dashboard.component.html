<div class="settings-container">
  <p-toast></p-toast>

  <!-- ── Header ─────────────────────────────────────────── -->
  <div class="surface-card shadow-1 border-round-xl p-4 mb-4 flex flex-column sm:flex-row justify-content-between sm:align-items-center gap-3">
    <div>
      <div class="flex align-items-center gap-2 mb-1">
        <i class="pi pi-cog text-primary"></i>
        <span class="text-500 text-sm">System Administration</span>
      </div>
      <h2 class="text-900 font-bold text-2xl m-0 mb-1">Website Configuration</h2>
      <span class="text-500 text-sm">Customize school portal homepage descriptions, contact details, gallery, and principal statements</span>
    </div>
  </div>

  <!-- Loading State Spinner -->
  <div *ngIf="settingsService.loading() && !settingsService.config()" class="surface-card shadow-1 border-round-xl p-6 text-center">
    <i class="pi pi-spin pi-spinner text-primary text-3xl"></i>
    <div class="text-500 text-sm mt-2">Loading website configuration...</div>
  </div>

  <!-- Form Layout -->
  <form [formGroup]="configForm" (ngSubmit)="onSubmit()" *ngIf="settingsService.config() || !settingsService.loading()">
    <div class="surface-card shadow-1 border-round-xl overflow-hidden mb-4">
      <p-tabs value="0">
        <p-tablist>
          <p-tab value="0">Portal Profile</p-tab>
          <p-tab value="1">Editorial Stories</p-tab>
          <p-tab value="2">Administration</p-tab>
          <p-tab value="3">Socials & Media</p-tab>
        </p-tablist>

        <p-tabpanels>
          <!-- Portal Profile -->
          <p-tabpanel value="0">
            <div class="p-4 grid">
              <!-- Tagline -->
              <div class="col-12 md:col-6 mb-3">
                <label for="portalTagline" class="text-700 font-semibold text-sm block mb-1.5">School Tagline / Motto</label>
                <input id="portalTagline" type="text" pInputText formControlName="tagline" placeholder="e.g. Inspiring Excellence, Empowering Minds" class="w-full border-round-md" />
              </div>

              <!-- Established Year -->
              <div class="col-12 md:col-6 mb-3">
                <label for="estYear" class="text-700 font-semibold text-sm block mb-1.5">Established Year</label>
                <input id="estYear" type="number" pInputText formControlName="establishedYear" placeholder="e.g. 1995" class="w-full border-round-md" />
                <small class="text-red-500" *ngIf="configForm.get('establishedYear')?.touched && configForm.get('establishedYear')?.invalid">
                  Must be between 1800 and 2100.
                </small>
              </div>

              <!-- Contact Phone -->
              <div class="col-12 md:col-6 mb-3">
                <label for="contactPhone" class="text-700 font-semibold text-sm block mb-1.5">Contact Phone Number</label>
                <input id="contactPhone" type="text" pInputText formControlName="contactPhone" placeholder="+91 98765 43210" class="w-full border-round-md" />
              </div>

              <!-- Contact Email -->
              <div class="col-12 md:col-6 mb-3">
                <label for="contactEmail" class="text-700 font-semibold text-sm block mb-1.5">Contact Email Address</label>
                <input id="contactEmail" type="email" pInputText formControlName="contactEmail" placeholder="admissions@school.com" class="w-full border-round-md" />
                <small class="text-red-500" *ngIf="configForm.get('contactEmail')?.touched && configForm.get('contactEmail')?.invalid">
                  Please enter a valid email.
                </small>
              </div>
            </div>
          </p-tabpanel>

          <!-- Editorial Stories -->
          <p-tabpanel value="1">
            <div class="p-4 flex flex-column gap-3">
              <!-- About Text -->
              <div>
                <label for="aboutUs" class="text-700 font-semibold text-sm block mb-1.5">About Our School</label>
                <textarea id="aboutUs" pTextarea formControlName="aboutText" rows="4" placeholder="Enter a descriptive history and overview of the school..." class="w-full border-round-md p-2"></textarea>
              </div>

              <!-- Mission Text -->
              <div>
                <label for="schoolMission" class="text-700 font-semibold text-sm block mb-1.5">Mission Statement</label>
                <textarea id="schoolMission" pTextarea formControlName="missionText" rows="3" placeholder="Our mission is to..." class="w-full border-round-md p-2"></textarea>
              </div>

              <!-- Vision Text -->
              <div>
                <label for="schoolVision" class="text-700 font-semibold text-sm block mb-1.5">Vision Statement</label>
                <textarea id="schoolVision" pTextarea formControlName="visionText" rows="3" placeholder="Our vision is to..." class="w-full border-round-md p-2"></textarea>
              </div>
            </div>
          </p-tabpanel>

          <!-- Administration -->
          <p-tabpanel value="2">
            <div class="p-4 flex flex-column gap-3">
              <!-- Principal Name -->
              <div>
                <label for="principalName" class="text-700 font-semibold text-sm block mb-1.5">Principal's Full Name</label>
                <input id="principalName" type="text" pInputText formControlName="principalName" placeholder="Dr. Sarah Jenkins" class="w-full border-round-md" />
              </div>

              <!-- Principal Message -->
              <div>
                <label for="principalMessage" class="text-700 font-semibold text-sm block mb-1.5">Principal's Address / Message</label>
                <textarea id="principalMessage" pTextarea formControlName="principalMessage" rows="6" placeholder="Welcome message to prospective parents and students..." class="w-full border-round-md p-2"></textarea>
              </div>
            </div>
          </p-tabpanel>

          <!-- Socials & Media -->
          <p-tabpanel value="3">
            <div class="p-4 grid">
              <!-- Facebook -->
              <div class="col-12 md:col-6 mb-3">
                <label for="linkFb" class="text-700 font-semibold text-sm block mb-1.5"><i class="pi pi-facebook mr-1 text-blue-600"></i> Facebook Page URL</label>
                <input id="linkFb" type="text" pInputText formControlName="facebook" placeholder="https://facebook.com/yourschool" class="w-full border-round-md" />
              </div>

              <!-- Twitter -->
              <div class="col-12 md:col-6 mb-3">
                <label for="linkTw" class="text-700 font-semibold text-sm block mb-1.5"><i class="pi pi-twitter mr-1 text-blue-400"></i> Twitter / X Profile URL</label>
                <input id="linkTw" type="text" pInputText formControlName="twitter" placeholder="https://twitter.com/yourschool" class="w-full border-round-md" />
              </div>

              <!-- Instagram -->
              <div class="col-12 md:col-6 mb-3">
                <label for="linkIg" class="text-700 font-semibold text-sm block mb-1.5"><i class="pi pi-instagram mr-1 text-pink-600"></i> Instagram Profile URL</label>
                <input id="linkIg" type="text" pInputText formControlName="instagram" placeholder="https://instagram.com/yourschool" class="w-full border-round-md" />
              </div>

              <!-- LinkedIn -->
              <div class="col-12 md:col-6 mb-3">
                <label for="linkLi" class="text-700 font-semibold text-sm block mb-1.5"><i class="pi pi-linkedin mr-1 text-blue-800"></i> LinkedIn Page URL</label>
                <input id="linkLi" type="text" pInputText formControlName="linkedin" placeholder="https://linkedin.com/company/yourschool" class="w-full border-round-md" />
              </div>

              <!-- Map Embed URL -->
              <div class="col-12 mb-3">
                <label for="mapEmbed" class="text-700 font-semibold text-sm block mb-1.5"><i class="pi pi-map-marker mr-1 text-red-500"></i> Google Maps Embed iframe Source URL (src attribute)</label>
                <input id="mapEmbed" type="text" pInputText formControlName="mapEmbedUrl" placeholder="https://www.google.com/maps/embed?pb=..." class="w-full border-round-md" />
              </div>

              <!-- Gallery Images -->
              <div class="col-12 mb-3">
                <label for="galleryImages" class="text-700 font-semibold text-sm block mb-1.5"><i class="pi pi-images mr-1 text-purple-500"></i> Gallery Image URLs (Enter one absolute image URL per line)</label>
                <textarea id="galleryImages" pTextarea formControlName="galleryUrlsText" rows="6" placeholder="https://example.com/school-front.jpg&#10;https://example.com/classroom.jpg" class="w-full border-round-md p-2"></textarea>
              </div>
            </div>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>

    <!-- Centralized save panel -->
    <div class="flex justify-content-end mb-5">
      <button pButton type="submit" label="Save Website Configuration" icon="pi pi-save" class="p-button-primary border-round-md w-auto px-5 py-2.5 font-bold" [disabled]="configForm.invalid || settingsService.saving()"></button>
    </div>
  </form>
</div>
