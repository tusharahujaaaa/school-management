<p-toast></p-toast>
<div class="staff-attendance-page">

  <!-- Header -->
  <div class="surface-card p-4 border-round-xl shadow-1 mb-4 flex flex-column md:flex-row justify-content-between align-items-md-center">
    <div>
      <h2 class="text-900 font-bold text-2xl m-0 mb-1">Staff Attendance</h2>
      <span class="text-500">Mark daily attendance for teachers and staff members</span>
    </div>
    <div class="flex gap-2 mt-3 md:mt-0">
      <button pButton label="Mark All Present" icon="pi pi-check" class="p-button-sm p-button-success p-button-outlined" (click)="markAllPresent()"></button>
      <button pButton label="Reset" icon="pi pi-refresh" class="p-button-sm p-button-secondary p-button-outlined" (click)="reset()"></button>
    </div>
  </div>

  <!-- Search -->
  <div class="surface-card shadow-1 border-round-xl p-3 mb-4">
    <div class="flex align-items-center gap-3">
      <span class="p-input-icon-left flex-grow-1">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Search by name, employee ID or department..." (input)="onSearch($event)" class="w-full border-round-lg">
      </span>
    </div>
  </div>

  <!-- Staff Table -->
  <div class="surface-card shadow-1 border-round-xl overflow-hidden">
    <div class="overflow-x-auto" style="max-height: 550px; overflow-y: auto;">
      <table class="w-full" style="border-collapse: collapse;">
        <thead style="position: sticky; top: 0; z-index: 1;">
          <tr class="surface-50">
            <th class="p-3 text-left border-bottom-1 surface-border text-500 font-medium text-sm">Employee ID</th>
            <th class="p-3 text-left border-bottom-1 surface-border text-500 font-medium text-sm">Staff Name</th>
            <th class="p-3 text-left border-bottom-1 surface-border text-500 font-medium text-sm">Department</th>
            <th class="p-3 text-left border-bottom-1 surface-border text-500 font-medium text-sm">Status</th>
            <th class="p-3 text-left border-bottom-1 surface-border text-500 font-medium text-sm">Quick Mark</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of staff()" class="hover:surface-50 transition-colors border-bottom-1 surface-border">
            <td class="p-3 text-700 font-mono">{{ member.employeeId }}</td>
            <td class="p-3">
              <div class="flex align-items-center gap-2">
                <div class="bg-purple-50 text-purple-600 border-circle flex align-items-center justify-content-center font-bold text-sm" style="width:2rem;height:2rem">
                  {{ member.name.charAt(0) }}
                </div>
                <div>
                  <div class="text-900 font-medium">{{ member.name }}</div>
                  <div class="text-500 text-xs">{{ member.role }}</div>
                </div>
              </div>
            </td>
            <td class="p-3 text-700">{{ member.department }}</td>
            <td class="p-3">
              <app-attendance-status-badge *ngIf="getStatus(member.id)" [status]="getStatus(member.id)!"></app-attendance-status-badge>
              <span *ngIf="!getStatus(member.id)" class="text-400 text-sm italic">Not marked</span>
            </td>
            <td class="p-3">
              <div class="flex gap-1 flex-wrap">
                <button *ngFor="let opt of statusOptions" (click)="markStatus(member.id, opt.value)"
                  class="border-round px-2 py-1 text-xs font-semibold border-1 cursor-pointer transition-all"
                  [ngClass]="{
                    'bg-green-500 border-green-500 text-white': getStatus(member.id) === opt.value && opt.value === 'present',
                    'bg-red-500 border-red-500 text-white': getStatus(member.id) === opt.value && opt.value === 'absent',
                    'bg-orange-500 border-orange-500 text-white': getStatus(member.id) === opt.value && opt.value === 'late',
                    'bg-yellow-500 border-yellow-500 text-white': getStatus(member.id) === opt.value && opt.value === 'half-day',
                    'bg-blue-500 border-blue-500 text-white': getStatus(member.id) === opt.value && opt.value === 'leave',
                    'surface-0 border-surface-300 text-500 hover:surface-100': getStatus(member.id) !== opt.value
                  }">{{ opt.label }}</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="staff().length === 0">
            <td colspan="5" class="p-6 text-center">
              <i class="pi pi-id-card text-200 text-4xl mb-3"></i>
              <p class="text-500 m-0">No staff found matching your search.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="p-3 border-top-1 surface-border flex justify-content-end gap-2">
      <button pButton label="Cancel" class="p-button-outlined p-button-secondary"></button>
      <button pButton label="Save Staff Attendance" icon="pi pi-save" [loading]="isSubmitting()" (click)="submit()"></button>
    </div>
  </div>
</div>
