<p-toast></p-toast>
<div class="staff-attendance-page">

  <!-- Header -->
  <app-erp-page-header 
    title="Staff Attendance" 
    subtitle="Mark daily attendance for teachers and staff members"
  >
    <div actions class="flex gap-2" *erpHasPermission="PERMS.STAFF.CREATE">
      <button pButton label="Mark All Present" icon="pi pi-check" class="p-button-sm p-button-success p-button-outlined" (click)="markAllPresent()"></button>
      <button pButton label="Reset" icon="pi pi-refresh" class="p-button-sm p-button-secondary p-button-outlined" (click)="reset()"></button>
    </div>
  </app-erp-page-header>

  <!-- Staff Table -->
  <app-erp-table
    [data]="staff()"
    [columns]="tableCols"
    [columnTemplates]="{ 'name': nameTmpl, 'status': statusTmpl }"
    [hasActions]="true"
    [actionTemplate]="quickMarkTmpl"
    (search)="onSearch($event)"
  >
    <!-- Custom Templates -->
    <ng-template #nameTmpl let-member>
      <div class="flex align-items-center gap-2">
        <div class="bg-purple-50 text-purple-600 border-circle flex align-items-center justify-content-center font-bold text-sm" style="width:2rem;height:2rem">
          {{ member.name.charAt(0) }}
        </div>
        <div>
          <div class="text-900 font-medium">{{ member.name }}</div>
          <div class="text-500 text-xs">{{ member.role }}</div>
        </div>
      </div>
    </ng-template>

    <ng-template #statusTmpl let-member>
      <app-erp-status-badge 
        *ngIf="getStatus(member.id)" 
        [label]="getStatusLabel(getStatus(member.id))" 
        [severity]="getStatusSeverity(getStatus(member.id))"
      ></app-erp-status-badge>
      <span *ngIf="!getStatus(member.id)" class="text-400 text-sm italic">Not marked</span>
    </ng-template>

    <ng-template #quickMarkTmpl let-member>
      <div class="flex gap-1 flex-wrap" *erpHasPermission="PERMS.STAFF.CREATE">
        <button *ngFor="let opt of statusOptions" (click)="markStatus(member.id, opt.value)"
          class="border-round px-2 py-1 text-xs font-semibold border-1 cursor-pointer transition-all"
          [ngClass]="{
            'bg-green-500 border-green-500 text-white': getStatus(member.id) === opt.value && opt.value === 'present',
            'bg-red-500 border-red-500 text-white': getStatus(member.id) === opt.value && opt.value === 'absent',
            'bg-orange-500 border-orange-500 text-white': getStatus(member.id) === opt.value && opt.value === 'late',
            'bg-yellow-500 border-yellow-500 text-white': getStatus(member.id) === opt.value && opt.value === 'half-day',
            'bg-blue-500 border-blue-500 text-white': getStatus(member.id) === opt.value && opt.value === 'leave',
            'surface-0 border-surface-300 text-500 hover:surface-100': getStatus(member.id) !== opt.value
          }">{{ opt.label }}</button>
      </div>
    </ng-template>
  </app-erp-table>

  <!-- Footer Actions -->
  <div class="mt-4 surface-card p-3 border-round-xl shadow-1 flex justify-content-end gap-2">
    <button pButton label="Cancel" class="p-button-outlined p-button-secondary" routerLink="/erp/dashboard"></button>
    <button *erpHasPermission="PERMS.STAFF.CREATE" pButton label="Save Staff Attendance" icon="pi pi-save" [loading]="isSubmitting()" (click)="submit()"></button>
  </div>
</div>
