<p-toast></p-toast>
<div class="student-attendance-page">

  <!-- Page Header -->
  <app-erp-page-header title="Student Attendance"
    subtitle="Mark daily student attendance by class and section"></app-erp-page-header>

  <!-- Step 1: Filters -->
  <div class="surface-card shadow-1 border-round-xl p-4 mb-4">
    <h3 class="m-0 text-700 font-semibold mb-3 text-lg flex align-items-center gap-2">
      <span
        class="bg-primary text-white border-circle w-2rem h-2rem flex align-items-center justify-content-center text-sm font-bold">1</span>
      Select Class, Section & Date
    </h3>
    <div class="grid">
      <div class="col-12 md:col-4">
        <label class="block text-700 font-medium mb-2">Date</label>
        <input type="date" [value]="selectedDate()" (change)="selectedDate.set($any($event.target).value)"
          class="w-full p-3 border-1 surface-border border-round-lg surface-0 text-900 outline-none">
      </div>
      <div class="col-12 md:col-4">
        <label class="block text-700 font-medium mb-2">Class</label>
        <p-select [options]="classOptions" [ngModel]="selectedClass()" (ngModelChange)="selectedClass.set($event)"
          styleClass="w-full" placeholder="Select Class"></p-select>
      </div>
      <div class="col-12 md:col-4">
        <label class="block text-700 font-medium mb-2">Section</label>
        <p-select [options]="sectionOptions" [ngModel]="selectedSection()" (ngModelChange)="selectedSection.set($event)"
          styleClass="w-full" placeholder="Select Section"></p-select>
      </div>
    </div>
  </div>

  <!-- Attendance Summary Chips -->
  <div class="surface-card shadow-1 border-round-xl p-3 mb-4">
    <div class="flex flex-wrap gap-3 align-items-center">
      <div class="flex align-items-center gap-2 px-3 py-2 bg-green-50 border-round-xl">
        <i class="pi pi-check-circle text-green-500"></i>
        <span class="font-bold text-green-700">{{ summary().present }}</span>
        <span class="text-500 text-sm">Present</span>
      </div>
      <div class="flex align-items-center gap-2 px-3 py-2 bg-red-50 border-round-xl">
        <i class="pi pi-times-circle text-red-500"></i>
        <span class="font-bold text-red-700">{{ summary().absent }}</span>
        <span class="text-500 text-sm">Absent</span>
      </div>
      <div class="flex align-items-center gap-2 px-3 py-2 bg-orange-50 border-round-xl">
        <i class="pi pi-clock text-orange-500"></i>
        <span class="font-bold text-orange-700">{{ summary().late }}</span>
        <span class="text-500 text-sm">Late</span>
      </div>
      <div class="flex align-items-center gap-2 px-3 py-2 bg-blue-50 border-round-xl">
        <i class="pi pi-calendar-minus text-blue-500"></i>
        <span class="font-bold text-blue-700">{{ summary().leave }}</span>
        <span class="text-500 text-sm">Leave</span>
      </div>
      <div class="flex align-items-center gap-2 px-3 py-2 bg-surface-100 border-round-xl">
        <i class="pi pi-minus-circle text-400"></i>
        <span class="font-bold text-500">{{ summary().unmarked }}</span>
        <span class="text-400 text-sm">Unmarked</span>
      </div>
    </div>
  </div>

  <!-- Step 2: Attendance Table -->
  <app-erp-table [data]="students()" [columns]="[
      { field: 'rollNumber', header: 'Roll No.' },
      { field: 'name', header: 'Student Name' },
      { field: 'status', header: 'Status' }
    ]" [columnTemplates]="{ 'name': nameTmpl, 'status': statusTmpl }" [hasActions]="true"
    [actionTemplate]="quickMarkTmpl" (search)="onSearch($event)">
    <div tableActions class="flex gap-2">
      <button pButton label="Mark All Present" icon="pi pi-check" class="p-button-sm p-button-success p-button-outlined"
        (click)="markAllPresent()"></button>
      <button pButton label="Mark All Absent" icon="pi pi-times" class="p-button-sm p-button-danger p-button-outlined"
        (click)="markAllAbsent()"></button>
      <button pButton label="Reset" icon="pi pi-refresh" class="p-button-sm p-button-secondary p-button-outlined"
        (click)="reset()"></button>
    </div>

    <!-- Custom Templates -->
    <ng-template #nameTmpl let-student>
      <div class="flex align-items-center gap-2">
        <div
          class="bg-primary-50 text-primary border-circle flex align-items-center justify-content-center font-bold text-sm"
          style="width:2rem;height:2rem">
          {{ student.name.charAt(0) }}
        </div>
        <span class="text-900 font-medium">{{ student.name }}</span>
      </div>
    </ng-template>

    <ng-template #statusTmpl let-student>
      <app-erp-status-badge *ngIf="getStatus(student.id)" [label]="getStatusLabel(getStatus(student.id))"
        [severity]="getStatusSeverity(getStatus(student.id))"></app-erp-status-badge>
      <span *ngIf="!getStatus(student.id)" class="text-400 text-sm italic">Not marked</span>
    </ng-template>

    <ng-template #quickMarkTmpl let-student>
      <div class="flex gap-1 flex-wrap">
        <button *ngFor="let opt of statusOptions" (click)="markStatus(student.id, opt.value)"
          class="border-round px-2 py-1 text-xs font-semibold border-1 cursor-pointer transition-all" [ngClass]="{
            'bg-green-500 border-green-500 text-white': getStatus(student.id) === opt.value && opt.value === 'present',
            'bg-red-500 border-red-500 text-white': getStatus(student.id) === opt.value && opt.value === 'absent',
            'bg-orange-500 border-orange-500 text-white': getStatus(student.id) === opt.value && opt.value === 'late',
            'bg-blue-500 border-blue-500 text-white': getStatus(student.id) === opt.value && opt.value === 'leave',
            'surface-0 border-surface-300 text-500 hover:surface-100': getStatus(student.id) !== opt.value
          }">{{ opt.label }}</button>
      </div>
    </ng-template>
  </app-erp-table>

  <!-- Footer Actions -->
  <div class="mt-4 surface-card p-3 border-round-xl shadow-1 flex justify-content-end gap-2">
    <button pButton label="Cancel" class="p-button-outlined p-button-secondary"></button>
    <button pButton label="Save Attendance" icon="pi pi-save" [loading]="isSubmitting()" (click)="submit()"></button>
  </div>
</div>
