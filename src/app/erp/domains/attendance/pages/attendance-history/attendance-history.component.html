<div class="attendance-history-page">

  <!-- Header -->
  <app-erp-page-header 
    title="Attendance History" 
    subtitle="View and manage past attendance records"
  ></app-erp-page-header>

  <!-- Filters -->
  <div class="surface-card shadow-1 border-round-xl p-4 mb-4">
    <div class="grid align-items-end">
      <div class="col-12 md:col-3">
        <label class="block text-700 font-medium mb-2">Date</label>
        <input type="date" [ngModel]="filterDate()" (ngModelChange)="filterDate.set($event)"
               class="w-full p-3 border-1 surface-border border-round-lg surface-0 text-900 outline-none">
      </div>
      <div class="col-12 md:col-3">
        <label class="block text-700 font-medium mb-2">Class</label>
        <p-select [options]="classOptions" [ngModel]="filterClass()" (ngModelChange)="filterClass.set($event)"
                    styleClass="w-full" placeholder="All Classes"></p-select>
      </div>
      <div class="col-12 md:col-3">
        <label class="block text-700 font-medium mb-2">Section</label>
        <p-select [options]="sectionOptions" [ngModel]="filterSection()" (ngModelChange)="filterSection.set($event)"
                    styleClass="w-full" placeholder="All Sections"></p-select>
      </div>
      <div class="col-12 md:col-3">
        <button pButton label="Reset Filters" icon="pi pi-filter-slash" class="p-button-outlined p-button-secondary w-full" (click)="resetFilters()"></button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <app-erp-table
    [data]="filteredHistory"
    [columns]="tableCols"
    [columnTemplates]="{ 'date': dateTmpl, 'percentage': pctTmpl }"
    [hasActions]="true"
    [actionTemplate]="actionTmpl"
  >
    <div tableActions>
       <button pButton label="Export" icon="pi pi-download" class="p-button-sm p-button-outlined"></button>
    </div>

    <ng-template #dateTmpl let-record>
      <span class="text-900 font-medium">{{ record.date | date:'dd MMM yyyy' }}</span>
    </ng-template>

    <ng-template #pctTmpl let-record>
      <span class="font-bold" [ngClass]="getPercentageClass(record.percentage)">{{ record.percentage }}%</span>
    </ng-template>

    <ng-template #actionTmpl let-record>
      <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm p-button-secondary" title="Edit attendance"></button>
      <button pButton icon="pi pi-eye" class="p-button-text p-button-sm p-button-info" title="View details"></button>
    </ng-template>
  </app-erp-table>
</div>
