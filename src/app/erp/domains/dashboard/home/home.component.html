<div class="dashboard-container">

  <!-- Section 1: Welcome Header -->
  <div class="surface-card p-4 border-round-xl shadow-1 mb-4 border-left-3 border-left-primary">
    <div class="flex flex-column md:flex-row align-items-md-center justify-content-between">
      <div>
        <h2 class="m-0 mb-2 text-900 font-bold text-3xl">Welcome back, Admin 👋</h2>
        <p class="m-0 text-500 text-lg">Here's what's happening at {{ branding.schoolName }} today.</p>
      </div>
      <div class="mt-3 md:mt-0 flex flex-column align-items-md-end">
        <span class="text-900 font-medium text-lg"><i class="pi pi-calendar mr-2"></i>{{ currentDate }}</span>
        <span class="text-500 mt-1">Academic Session: {{ academicSession }}</span>
      </div>
    </div>
  </div>

  <!-- Section 2: Quick Stats Cards -->
  <div class="grid mb-4">
    <div class="col-12 sm:col-6 lg:col-4 xl:col-2" *ngFor="let stat of stats()">
      <app-stat-card [stat]="stat"></app-stat-card>
    </div>
  </div>

  <div class="grid mb-4">
    <!-- Left Column (8/12) -->
    <div class="col-12 xl:col-8">
      
      <div class="grid">
        <!-- Section 3: Attendance Overview (Placeholder Chart) -->
        <div class="col-12 md:col-6">
          <div class="surface-card shadow-1 p-4 border-round-xl h-full">
            <app-section-header title="Attendance Overview" actionLabel="View Report"></app-section-header>
            <div class="mt-4 border-round-xl surface-50 p-4 text-center border-1 surface-border flex flex-column justify-content-center align-items-center" style="min-height: 200px">
              <div class="text-green-500 font-bold text-5xl mb-2">94.5%</div>
              <span class="text-500 font-medium">Overall Attendance Today</span>
              <div class="w-full mt-4">
                <div class="flex justify-content-between text-sm mb-2 font-medium">
                  <span class="text-700">Present: 2,688</span>
                  <span class="text-700">Absent: 157</span>
                </div>
                <p-progressBar [value]="94.5" [showValue]="false" styleClass="h-1rem bg-red-100" [style]="{'--p-progressbar-value-background': 'var(--green-500)'}"></p-progressBar>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 4: Fee Collection Overview -->
        <div class="col-12 md:col-6">
          <div class="surface-card shadow-1 p-4 border-round-xl h-full">
            <app-section-header title="Fee Collection" actionLabel="View Details"></app-section-header>
            <div class="mt-4 border-round-xl surface-50 p-4 border-1 surface-border" style="min-height: 200px">
               <div class="mb-4">
                 <span class="block text-500 font-medium mb-1">Total Collected (This Month)</span>
                 <div class="text-blue-600 font-bold text-4xl">$124,500</div>
               </div>
               <div>
                 <div class="flex justify-content-between text-sm mb-2 font-medium">
                  <span class="text-700">Target: $150,000</span>
                  <span class="text-700">83%</span>
                 </div>
                 <p-progressBar [value]="83" [showValue]="false" styleClass="h-1rem bg-blue-100"></p-progressBar>
               </div>
               <div class="mt-4 grid">
                 <div class="col-6">
                   <div class="bg-orange-50 p-3 border-round text-center">
                     <span class="block text-orange-600 font-bold text-xl mb-1">142</span>
                     <span class="text-orange-500 text-sm font-medium">Pending Dues</span>
                   </div>
                 </div>
                 <div class="col-6">
                   <div class="bg-green-50 p-3 border-round text-center">
                     <span class="block text-green-600 font-bold text-xl mb-1">$45k</span>
                     <span class="text-green-500 text-sm font-medium">Total Pending</span>
                   </div>
                 </div>
               </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 5: Recent Activities -->
      <div class="surface-card shadow-1 p-4 border-round-xl mt-4">
        <app-section-header title="Recent Activities" actionLabel="View All"></app-section-header>
        <div class="mt-3">
          <app-activity-list [activities]="activities()"></app-activity-list>
        </div>
      </div>
      
    </div>

    <!-- Right Column (4/12) -->
    <div class="col-12 xl:col-4">
      
      <!-- Section 7: Quick Actions -->
      <div class="surface-card shadow-1 p-4 border-round-xl mb-4">
        <app-section-header title="Quick Actions"></app-section-header>
        <div class="grid mt-2">
          <div class="col-4" *ngFor="let action of quickActions() | slice:0:3">
            <app-quick-action-card [action]="action"></app-quick-action-card>
          </div>
          <div class="col-6" *ngFor="let action of quickActions() | slice:3:5">
             <app-quick-action-card [action]="action"></app-quick-action-card>
          </div>
        </div>
      </div>

      <!-- Section 6: Upcoming Events -->
      <div class="surface-card shadow-1 p-4 border-round-xl mb-4">
        <app-section-header title="Upcoming Events" actionLabel="Calendar"></app-section-header>
        <div class="mt-3">
          <app-event-card *ngFor="let event of events()" [event]="event"></app-event-card>
        </div>
      </div>

      <!-- Section 8: Notifications Panel -->
      <div class="surface-card shadow-1 p-4 border-round-xl">
        <app-section-header title="Notifications" actionLabel="Clear All"></app-section-header>
        <div class="mt-3">
          <app-notification-card *ngFor="let notif of notifications()" [notification]="notif"></app-notification-card>
        </div>
      </div>

    </div>
  </div>

</div>
