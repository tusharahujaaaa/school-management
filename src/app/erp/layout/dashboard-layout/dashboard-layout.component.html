<div class="erp-app erp-dashboard-layout" [class.sidebar-hidden]="!sidebarVisible()">
  <!-- Topbar -->
  <div class="erp-topbar flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom-1 surface-border">
    <div class="flex align-items-center gap-3">
      <button class="p-link text-xl" (click)="toggleSidebar()">
        <i class="pi pi-bars text-700"></i>
      </button>
      <span class="text-xl font-bold text-900">{{ branding.schoolName }}</span>
    </div>
    <div class="topbar-actions">
      <button class="p-link" (click)="logout()" title="Logout">
        <i class="pi pi-sign-out text-xl text-700 hover:text-primary transition-colors transition-duration-150"></i>
      </button>
    </div>
  </div>

  <div class="erp-main-container flex">
    <!-- Sidebar -->
    <div class="erp-sidebar bg-white border-right-1 surface-border w-15rem flex-shrink-0 transition-all transition-duration-300 h-screen overflow-y-auto">
      <div class="p-3">
        <ul class="list-none p-0 m-0">
          <li class="mb-2">
            <a routerLink="/erp/dashboard" class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors" routerLinkActive="surface-100 text-primary font-semibold">
              <i class="pi pi-home mr-2"></i>
              <span class="font-medium">Dashboard</span>
            </a>
          </li>
          <!-- More items will go here -->
        </ul>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="erp-content flex-grow-1 p-4 surface-ground overflow-y-auto h-screen">
      <!-- Breadcrumb placeholder -->
      <div class="text-500 mb-3">ERP / Dashboard</div>
      
      <!-- Content Outlet -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
