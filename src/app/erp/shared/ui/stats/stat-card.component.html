<div class="surface-card shadow-1 p-3 border-round-xl hover:shadow-2 transition-all transition-duration-200 border-1 border-transparent hover:border-primary-100 h-full">
  <div class="flex justify-content-between mb-3">
    <div>
      <span class="block text-500 font-medium mb-3">{{ title }}</span>
      <div class="text-900 font-bold text-2xl">{{ value }}</div>
    </div>
    <div 
      class="flex align-items-center justify-content-center border-round-lg" 
      [ngClass]="iconBgClass" 
      style="width:3rem;height:3rem"
    >
      <i [class]="icon + ' text-xl'"></i>
    </div>
  </div>
  
  <div class="flex align-items-center" *ngIf="trendLabel">
    <span 
      class="font-medium text-sm" 
      [ngClass]="trendUp ? 'text-green-500' : 'text-orange-500'"
    >
      <i [class]="trendUp ? 'pi pi-arrow-up' : 'pi pi-arrow-down'" style="font-size: 0.75rem"></i>
      {{ trendLabel }}
    </span>
    <span class="text-500 text-sm ml-1" *ngIf="trendDesc">{{ trendDesc }}</span>
  </div>
</div>
