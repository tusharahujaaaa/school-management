<div class="global-search-container relative w-full">
  <!-- Search Input Wrapper -->
  <div class="search-input-wrapper flex align-items-center border-round-3xl surface-100 px-3 py-2 border-1 border-transparent focus-within:border-primary focus-within:surface-0 transition-colors shadow-none hover:surface-200">
    <i class="pi pi-search text-500 mr-2"></i>
    <input #searchInput type="text" pInputText placeholder="Search students, staff, teachers..." 
           class="w-full border-none bg-transparent outline-none shadow-none text-900 p-0 text-sm md:text-base custom-style-1"
           [value]="query()" (input)="onSearch($event)" (focus)="onFocus()" >
    <i *ngIf="query()" class="pi pi-times text-500 cursor-pointer ml-2 hover:text-700 transition-colors" (click)="clearSearch()"></i>
  </div>

  <!-- Dropdown -->
  <div #dropdown *ngIf="showDropdown()" class="search-dropdown absolute left-0 top-100 mt-2 w-full surface-card shadow-4 border-round-xl overflow-hidden z-5">
    
    <!-- Loading -->
    <div *ngIf="isLoading()" class="p-4 flex justify-content-center align-items-center">
      <p-progressSpinner styleClass="w-2rem h-2rem" strokeWidth="4"></p-progressSpinner>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading() && results().length === 0" class="p-4 text-center text-500">
      <i class="pi pi-search mb-3 text-3xl"></i>
      <p class="m-0">No results found for "{{ query() }}"</p>
    </div>

    <!-- Results -->
    <div *ngIf="!isLoading() && results().length > 0" class="search-results max-h-20rem overflow-y-auto py-2">
      <div *ngFor="let category of results()">
        <div class="px-3 py-2 text-xs font-bold text-500 uppercase surface-50 border-y-1 surface-border">
          {{ category.label }} ({{ category.results.length }})
        </div>
        <ul class="list-none p-0 m-0">
          <li *ngFor="let item of category.results" class="px-3 py-2 hover:surface-hover cursor-pointer flex align-items-center transition-colors">
            <div class="flex align-items-center justify-content-center bg-primary-50 text-primary border-circle mr-3 avatar-box" >
              <i [class]="item.icon"></i>
            </div>
            <div class="flex-grow-1 overflow-hidden">
              <div class="flex align-items-center justify-content-between">
                <span class="text-900 font-medium text-overflow-ellipsis white-space-nowrap overflow-hidden">{{ item.name }}</span>
                <span class="text-500 text-sm ml-2 font-medium">{{ item.entityId }}</span>
              </div>
              <span class="text-500 text-sm block text-overflow-ellipsis white-space-nowrap overflow-hidden">{{ item.metadata }}</span>
            </div>
          </li>
        </ul>
      </div>
    </div>
    
    <!-- Footer / Advanced Search Link -->
    <div *ngIf="!isLoading() && results().length > 0" class="p-2 border-top-1 surface-border text-center bg-primary-50 hover:bg-primary-100 cursor-pointer transition-colors text-sm font-medium text-primary">
      View all results
    </div>
  </div>
</div>
